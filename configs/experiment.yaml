# 실험 설정 한 곳에 모아두기 (탐구 보고서의 "통제 변인"이 여기 다 있음)

model:
  id: openai/gpt-oss-20b          # 원본 MXFP4 체크포인트 (약 13GB)
  num_experts: 32
  top_k: 4                        # 남길 전문가 수는 반드시 top_k 이상

calibration:                      # 01_calibrate.py
  seq_len: 512
  n_chunks: 512                   # 512 x 512 = 약 26만 토큰
  batch_size: 8
  sources:
    ko: {dataset: wikimedia/wikipedia, file: 20231101.ko/train-00000-of-00003.parquet}
    en: {dataset: wikimedia/wikipedia, file: 20231101.en/train-00000-of-00041.parquet}

heldout:                          # 퍼플렉시티용 텍스트 (보정 데이터와 다른 파일)
  ko: {dataset: wikimedia/wikipedia, file: 20231101.ko/train-00002-of-00003.parquet, n_chars: 300000}
  en: {dataset: wikimedia/wikipedia, file: 20231101.en/train-00040-of-00041.parquet, n_chars: 300000}

pruning:                          # 02_prune.py 로 만들 변형들
  variants:
    - {name: ko-reap-k24, calib: ko, criterion: reap, keep: 24}
    - {name: ko-reap-k16, calib: ko, criterion: reap, keep: 16}
    - {name: en-reap-k24, calib: en, criterion: reap, keep: 24}
    - {name: en-reap-k16, calib: en, criterion: reap, keep: 16}
    - {name: ko-freq-k16, calib: ko, criterion: freq, keep: 16}

quantization:                     # llama-quantize 타입 (gpt-oss는 2880이 256으로 안 나눠져서 K-quant는 Q4_0 등으로 대체됨)
  base_variant: ko-reap-k16
  # 변환만 한 GGUF = 전문가 MXFP4(원본 그대로) + 나머지 BF16  -> 프루닝 단계 비교에 사용 (손실 없음)
  # MXFP4_MOE = 전문가 MXFP4 + 나머지 Q8_0 (배포용),  Q8_0 / Q4_0 = 전부 해당 형식
  types: [MXFP4_MOE, Q8_0, Q4_0]

lora:                             # 04_train_lora.py
  base_variant: ko-reap-k16
  dataset: nlpai-lab/kullm-v2     # apache-2.0
  n_examples: 6000
  max_len: 1024
  epochs: 1
  lr: 2.0e-4
  r: 16
  alpha: 32
  lora_experts: true              # 전문가 가중치(3D 파라미터)에도 LoRA
  batch_size: 2
  grad_accum: 8

eval:                             # 05_eval.py
  kmmlu_per_subject: 20           # 45과목 x 20 = 900문항
  mmlu_per_subject: 10            # 57과목 x 10 = 570문항 (영어 능력이 얼마나 줄었는지 확인용)
  haerae: all                     # 1538문항
  prompt_format: harmony          # harmony(채팅 형식) | plain
  seed: 0
  ppl_ctx: 512
  ppl_chunks: 200

economics:                        # 07_econ.py
  krw_per_usd: 1400
  colab_usd_per_cu: 0.10
  vram_overhead_gb: 1.5           # KV 캐시 + 런타임 여유분
  gpus:                           # 가격은 2026년 확인 값. cu_per_hour는 코랩 유닛, krw_per_hour는 원화
    T4 (Colab):         {vram_gb: 15,   cu_per_hour: 1.19}
    L4 (Colab):         {vram_gb: 22.5, cu_per_hour: 1.71}
    A100-40GB (Colab):  {vram_gb: 40,   cu_per_hour: 5.40}
    A100-80GB (Colab):  {vram_gb: 80,   cu_per_hour: 7.52}
    A100-80GB (Elice):  {vram_gb: 80,   krw_per_hour: 2500}
    H100-80GB (Elice):  {vram_gb: 80,   krw_per_hour: 5500}
    B200-180GB (Elice): {vram_gb: 180,  krw_per_hour: 10500}
